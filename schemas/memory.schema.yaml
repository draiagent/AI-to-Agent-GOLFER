$schema: "https://json-schema.org/draft/2020-12/schema"
title: Course Memory Pack
type: object
required: [id, task_ref, sources, facts, knowledge_gaps]
properties:
  id: {type: string}
  task_ref: {type: string}
  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [source_id, title, updated_at, trust]
      properties:
        source_id: {type: string}
        title: {type: string}
        updated_at: {type: string, format: date}
        trust: {enum: [low, medium, high, authoritative]}
        access: {enum: [public, internal, restricted]}
  facts:
    type: array
    items:
      type: object
      required: [statement, source_id, valid_until]
      properties:
        statement: {type: string}
        source_id: {type: string}
        valid_until: {type: string, format: date}
  knowledge_gaps: {type: array, items: {type: string}}
