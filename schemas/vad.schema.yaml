$schema: "https://json-schema.org/draft/2020-12/schema"
title: VAD Course Map
type: object
required: [id, title, goal, stakeholders, inputs, constraints, risks, acceptance_criteria]
properties:
  id: {type: string, minLength: 3}
  title: {type: string, minLength: 3}
  goal:
    type: object
    required: [business_outcome, metric]
    properties:
      business_outcome: {type: string}
      metric: {type: string}
  stakeholders:
    type: array
    minItems: 1
    items: {type: string}
  inputs:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, source, required]
      properties:
        name: {type: string}
        source: {type: string}
        required: {type: boolean}
  constraints: {type: array, items: {type: string}}
  risks:
    type: array
    items:
      type: object
      required: [risk, level, mitigation]
      properties:
        risk: {type: string}
        level: {enum: [R0, R1, R2, R3, R4]}
        mitigation: {type: string}
  acceptance_criteria:
    type: array
    minItems: 1
    items: {type: string}
