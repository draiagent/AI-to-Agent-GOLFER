$schema: "https://json-schema.org/draft/2020-12/schema"
title: VAC Shot Playbook
type: object
required: [id, title, version, owner, trigger, applicability, inputs, decision_rule, workflow_ref, verify_ref, expires_at]
properties:
  id: {type: string}
  title: {type: string}
  version: {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"}
  owner: {type: string}
  trigger: {type: string}
  applicability:
    type: object
    required: [use_when, do_not_use_when]
    properties:
      use_when: {type: array, minItems: 1, items: {type: string}}
      do_not_use_when: {type: array, minItems: 1, items: {type: string}}
  inputs: {type: array, minItems: 1, items: {type: string}}
  decision_rule: {type: string}
  workflow_ref: {type: string}
  verify_ref: {type: string}
  brand_ref: {type: string}
  expires_at: {type: string, format: date}
  change_log: {type: array, items: {type: string}}
